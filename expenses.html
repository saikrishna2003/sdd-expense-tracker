<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="All your recorded expenses, filterable by month and category." />
    <title>Expenses · Expensify</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>
  <body>
    <header id="app-header"></header>

    <main id="main" class="mx-auto w-full max-w-6xl px-4 py-6 md:px-6">
      <div id="page-alert"></div>

      <div class="mb-6">
        <h1 class="text-2xl font-bold">Expenses</h1>
        <p id="list-subtitle" class="text-sm text-muted-foreground"></p>
      </div>

      <div id="no-expenses" hidden></div>

      <div id="list-area" class="space-y-4" hidden>
        <form id="filters" class="card gap-4 py-4" aria-label="Filter expenses">
          <section class="grid grid-cols-2 gap-3 md:grid-cols-[1fr_1fr_auto] md:items-end">
            <div class="field min-w-0">
              <label for="filter-month">Month</label>
              <select id="filter-month" name="month" class="select min-h-11 w-full"></select>
            </div>
            <div class="field min-w-0">
              <label for="filter-category">Category</label>
              <select id="filter-category" name="category" class="select min-h-11 w-full"></select>
            </div>
            <button type="button" id="clear-filters" class="btn col-span-2 min-h-11 md:col-span-1" data-variant="outline">Clear filters</button>
          </section>
        </form>

        <p id="list-summary" class="text-sm font-medium" tabindex="-1" aria-live="polite"></p>

        <div id="list-empty" hidden></div>

        <div id="list-results">
          <div class="hidden overflow-hidden rounded-xl border md:block">
            <div class="table-container">
              <table class="table">
                <thead>
                  <tr>
                    <th scope="col">Date</th>
                    <th scope="col">Category</th>
                    <th scope="col">Description</th>
                    <th scope="col" class="text-right">Amount</th>
                    <th scope="col"><span class="sr-only">Actions</span></th>
                  </tr>
                </thead>
                <tbody id="expense-rows"></tbody>
              </table>
            </div>
          </div>
          <ul id="expense-cards" class="divide-y rounded-xl border px-4 md:hidden"></ul>
          <div id="show-more-wrap" class="mt-4 flex justify-center" hidden>
            <button type="button" id="show-more" class="btn min-h-11" data-variant="outline">Show more</button>
          </div>
        </div>
      </div>

      <dialog id="delete-dialog" class="alert-dialog" aria-labelledby="delete-dialog-title" aria-describedby="delete-dialog-description">
        <div>
          <header>
            <h2 id="delete-dialog-title">Delete this expense?</h2>
            <p id="delete-dialog-description">This can't be undone.</p>
          </header>
          <footer>
            <button type="button" id="cancel-delete" class="btn min-h-11" data-variant="outline">Cancel</button>
            <button type="button" id="confirm-delete" class="btn min-h-11" data-variant="destructive">Delete</button>
          </footer>
        </div>
      </dialog>
    </main>

    <div id="toaster" class="toaster"></div>
    <script type="module" src="/src/pages/expenses.js"></script>
  </body>
</html>
