<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Expensify – track your day-to-day expenses and see where your money goes." />
    <title>Dashboard · Expensify</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>
  <body>
    <header id="app-header"></header>

    <main id="main" class="mx-auto w-full max-w-6xl px-4 py-6 md:px-6">
      <div id="page-alert"></div>

      <div id="welcome" hidden></div>

      <div id="dashboard" class="space-y-6" hidden>
        <div class="flex items-center justify-between gap-2">
          <a id="prev-month" href="./" class="btn min-h-11 min-w-11" data-variant="outline">
            <svg xmlns="http://www.w3.org/2000/svg" class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6" /></svg>
            <span class="sr-only sm:not-sr-only">Previous</span>
          </a>
          <h1 id="month-title" class="text-center text-xl font-bold md:text-2xl"></h1>
          <a id="next-month" href="./" class="btn min-h-11 min-w-11" data-variant="outline">
            <span class="sr-only sm:not-sr-only">Next</span>
            <svg xmlns="http://www.w3.org/2000/svg" class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6" /></svg>
          </a>
        </div>

        <section aria-label="Monthly summary" class="grid grid-cols-2 gap-4 md:grid-cols-3">
          <div class="card col-span-2 gap-2 py-4 md:col-span-1">
            <header>
              <p class="text-sm text-muted-foreground">Total spent</p>
            </header>
            <section>
              <p id="total-spent" class="text-2xl font-bold tabular-nums break-all"></p>
            </section>
          </div>
          <div class="card gap-2 py-4">
            <header>
              <p class="text-sm text-muted-foreground">Expenses</p>
            </header>
            <section>
              <p id="expense-count" class="text-2xl font-bold tabular-nums"></p>
            </section>
          </div>
          <div class="card gap-2 py-4">
            <header>
              <p class="text-sm text-muted-foreground">Top category</p>
            </header>
            <section>
              <p id="top-category" class="flex min-w-0 items-center gap-2 text-lg font-bold md:text-2xl"></p>
            </section>
          </div>
        </section>

        <div class="grid gap-6 md:grid-cols-2">
          <section class="card" aria-labelledby="breakdown-title">
            <header>
              <h2 id="breakdown-title" class="text-lg font-semibold">Spending by category</h2>
            </header>
            <section id="breakdown-body"></section>
          </section>
          <section class="card" aria-labelledby="trend-title">
            <header>
              <h2 id="trend-title" class="text-lg font-semibold">Last 6 months</h2>
            </header>
            <section id="trend-body"></section>
          </section>
        </div>

        <section class="card" aria-labelledby="recent-title">
          <header>
            <h2 id="recent-title" class="text-lg font-semibold">Recent expenses</h2>
            <a id="view-all" href="./expenses.html" class="card-action btn min-h-11" data-variant="link">View all</a>
          </header>
          <section id="recent-body"></section>
        </section>
      </div>
    </main>

    <div id="toaster" class="toaster"></div>
    <script type="module" src="/src/pages/dashboard.js"></script>
  </body>
</html>
